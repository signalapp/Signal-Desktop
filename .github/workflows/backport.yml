name: Backport
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, closed]

jobs:
  backport:
    name: Apply labels and open backport pull requests
    if: ${{ github.repository == 'signalapp/Signal-Desktop-Private' }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels and open backport pull requests
        uses: signalapp/Signal-Backport-Action-Private@main
        with:
          token: ${{ secrets.AUTOMATED_GITHUB_PAT }}
          git-email: backport-bot@signal.org
          git-name: Backport Bot
