name: CI
on:
  push:
    branches:
      - development
      - main
      - '[0-9]+.[0-9]+.x'
  pull_request:

permissions:
  contents: read

concurrency:
  # Pushes get their own group so they never queue or cancel
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # actions/checkout: aborts slow git transfers so it retries the fetch
  GIT_HTTP_LOW_SPEED_LIMIT: 1000000 # 1MB/s
  GIT_HTTP_LOW_SPEED_TIME: 60 # for 60s
  # actions/cache: treats a stuck download as a cache miss (default: 10 minutes)
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      sticker-creator: ${{ steps.changes.outputs.sticker-creator }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
      axo: ${{ steps.changes.outputs.axo }}
      changesets-release: ${{ steps.changes.outputs.changesets-release }}
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: &changes-checkout-with
          filter: blob:none
          fetch-depth: 2
          sparse-checkout: /.github/scripts/paths-filter.mjs
          sparse-checkout-cone-mode: false

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: &retry-checkout-env
          # Logs connection and TLS events to diagnose hung fetches
          GIT_TRACE_CURL: 1
          GIT_TRACE_CURL_NO_DATA: 1
        with: *changes-checkout-with

      - name: Check for changes
        id: changes
        env:
          # Globs matched as git `:(glob)` pathspecs
          FILTERS: |
            sticker-creator:
              paths-any:
                - sticker-creator/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - .pnpmfile.mjs
                - .github/actions/setup/**
                - .github/workflows/ci.yml
            dependencies:
              paths-any:
                - '**/package.json'
                - '**/pnpm-lock.yaml'
                - '**/pnpm-workspace.yaml'
                - '**/.pnpmfile.mjs'
                - .github/workflows/ci.yml
            # Lint keeps ts/axo from importing the rest of ts/
            axo:
              paths-any:
                - ts/axo/**
                - vitest.config.mts
                - stylesheets/**
                - fonts/**
                - packages/types/**
                - scripts/generate-emoji-data.mjs
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - .pnpmfile.mjs
                - tsconfig.json
                - .github/actions/setup/**
                - .github/workflows/ci.yml
            changesets-release:
              if: ${{ github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main' && github.event.pull_request.user.login == 'automated-signal' }}
              paths-only:
                - .changeset/**
                - packages/*/CHANGELOG.md
                - packages/*/package.json
        run: |
          filters=$(yq --output-format=json --indent=0 <<< "$FILTERS")
          node .github/scripts/paths-filter.mjs --base HEAD^1 --filters "$filters" >> "$GITHUB_OUTPUT"

  dependencies:
    name: Dependencies
    needs: changes
    # These checks only read the lockfile, so nothing is installed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: &dependencies-checkout-with
          filter: blob:none

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env
        with: *dependencies-checkout-with

      - name: Setup pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
          # Its keys are unique per run, so it never hits and saves every time
          cache: false

      - name: Run pnpmfile tests
        background: true
        run: node --test .pnpmfile.mjs

      - name: Audit dependencies
        background: true
        # Only fail on main, old advisories shouldn't block backports
        run: >-
          node .github/scripts/audit-deps/check.mjs
          ${{ (github.base_ref || github.ref_name) != 'main' && '--report-only' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit dependency signatures
        if: ${{ needs.changes.outputs.dependencies == 'true' }}
        background: true
        run: pnpm audit signatures

      - name: Check for duplicate dependencies
        if: ${{ needs.changes.outputs.dependencies == 'true' }}
        background: true
        run: pnpm dedupe --check

  lint:
    name: Lint
    runs-on: ubuntu-22.04-8-cores
    timeout-minutes: 8
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: &lint-checkout-with
          filter: blob:none

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env
        with: *lint-checkout-with

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          apt-packages: libpulse0

      - id: generate
        name: Run generate
        background: true
        run: pnpm run generate

      - name: Check license comments
        background: true
        run: pnpm run lint-license-comments

      - name: Check prettier
        background: true
        run: pnpm run lint-prettier --cache-location=~/.cache/prettier

      - name: Lint styles
        background: true
        run: pnpm run lint-css

      - name: Lint deps
        background: true
        run: pnpm run lint-deps

      - name: Lint intl
        background: true
        run: pnpm run lint-intl

      - name: Check Knip (All)
        background: true
        run: pnpm run lint-knip:all --reporter github-actions

      - name: Check Knip (Prod)
        background: true
        run: pnpm run lint-knip:prod --reporter github-actions

      - name: Check acknowledgments
        background: true
        run: |
          pnpm run build:acknowledgments
          git diff --exit-code
        env:
          REQUIRE_SIGNAL_LIB_FILES: 1

      # wait for only `generate` instead of having two separate parallel groups so
      # these additional steps can run as soon as generate is done instead of
      # waiting for all of the tasks of the previous `parallel` group
      - name: Wait for generate
        wait: generate

      - name: Check database schema
        background: true
        run: pnpm run build:db-schema --check

      - name: Check TypeScript
        background: true
        run: pnpm run check:types

      - name: Check Oxlint
        background: true
        run: pnpm run oxlint:ci

      - name: Check Oxlint Tests
        background: true
        run: pnpm run test-oxlint

      - name: Check unused icons
        background: true
        run: pnpm run check:unused-icons

      - name: Check unused styles
        background: true
        run: pnpm run check:unused-styles:check

  macos:
    name: MacOS
    runs-on: macos-26
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 25

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: &macos-checkout-with
          filter: blob:none

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env
        with: *macos-checkout-with

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          cache-electron-builder: true
          save-pnpm-cache: true

      - name: Prepare beta build
        run: pnpm run prepare-beta-build

      - name: Run generate
        run: pnpm run generate

      - name: Run node tests
        run: pnpm run test-node

      - name: Run electron tests
        run: pnpm run test-electron
        env:
          ARTIFACTS_DIR: artifacts/macos
          WORKER_COUNT: 4
        timeout-minutes: 5

      - name: Build release
        run: |
          touch noop.sh
          chmod +x noop.sh
          pnpm run build:release
        env:
          DISABLE_INSPECT_FUSE: on
          SIGN_MACOS_SCRIPT: noop.sh
          ARTIFACTS_DIR: artifacts/macos

      - name: Upload installer size
        if: ${{ github.repository == 'signalapp/Signal-Desktop-Private' && github.ref == 'refs/heads/main' }}
        run: |
          node scripts/publish-installer-size.mjs macos-arm64
          node scripts/publish-installer-size.mjs macos-x64
          node scripts/publish-installer-size.mjs macos-universal

      - name: Run release tests
        run: pnpm run test-release
        env:
          NODE_ENV: production

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts

  linux:
    name: Linux
    needs: changes
    if: ${{ needs.changes.outputs.changesets-release != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04-8-cores
            arch: x64
          - os: ubuntu-22.04-arm64-4-cores
            arch: arm64
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          apt-packages: xvfb libpulse0
          cache-electron-builder: true
          save-pnpm-cache: true

      - name: Prepare beta builde
        run: pnpm run prepare-beta-build

      - name: Run generate
        run: pnpm run generate

      - name: Run node tests
        run: xvfb-run --auto-servernum pnpm run test-node

      - name: Create preload cache
        run: xvfb-run --auto-servernum pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/linux

      - name: Set Linux build target architecture
        run: pnpm run prepare-linux-build deb ${{ matrix.arch }}

      - name: Build with packaging .deb file
        run: pnpm run build:release --publish=never
        if: github.ref == 'refs/heads/main'
        env:
          CC: sccache gcc
          CXX: sccache g++
          SCCACHE_GHA_ENABLED: true
          DISABLE_INSPECT_FUSE: on

      - name: Build without packaging .deb file
        run: pnpm run build:release --linux dir
        if: github.ref != 'refs/heads/main'
        env:
          CC: sccache gcc
          CXX: sccache g++
          SCCACHE_GHA_ENABLED: true
          DISABLE_INSPECT_FUSE: on

      - name: Upload installer size
        if: ${{ github.repository == 'signalapp/Signal-Desktop-Private' && github.ref == 'refs/heads/main' }}
        run: node scripts/publish-installer-size.mjs linux-${{ matrix.arch }}

      - name: Clone backup integration tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          repository: 'signalapp/Signal-Message-Backup-Tests'
          ref: 'a0f900243210efbedc72f0907c5d2f140385daa4'
          path: 'backup-integration-tests'

      - name: Run electron tests
        run: xvfb-run --auto-servernum pnpm run test-electron
        timeout-minutes: 5
        env:
          ARTIFACTS_DIR: artifacts/linux
          LANG: en_US
          LANGUAGE: en_US
          BACKUP_INTEGRATION_DIR: 'backup-integration-tests/test-cases'
          WORKER_COUNT: 8

      - name: Run release tests
        run: xvfb-run --auto-servernum pnpm run test-release
        env:
          NODE_ENV: production

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts

  windows:
    name: Windows
    needs: changes
    if: ${{ needs.changes.outputs.changesets-release != 'true' }}
    runs-on: windows-latest-8-cores
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          cache-electron-builder: true
          save-pnpm-cache: true

      - name: Remove certificate fields from package.json
        run: |
          copy package.json temp.json
          del package.json
          type temp.json | findstr /v certificateSubjectName | findstr /v certificateSha1 > package.json

      - name: Prepare beta build
        run: pnpm run prepare-beta-build

      - name: Run generate
        run: pnpm run generate

      - name: Run node tests
        run: pnpm run test-node

      - name: Create preload cache
        run: pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/win

      - name: Build with NSIS
        run: pnpm run build:release --publish=never
        if: github.ref == 'refs/heads/main'
        env:
          DISABLE_INSPECT_FUSE: on

      - name: Build without NSIS
        run: pnpm run build:release --win dir
        if: github.ref != 'refs/heads/main'
        env:
          DISABLE_INSPECT_FUSE: on

      - name: Upload installer size
        if: ${{ github.repository == 'signalapp/Signal-Desktop-Private' && github.ref == 'refs/heads/main' }}
        run: node scripts/publish-installer-size.mjs windows

      - name: Run electron tests
        run: pnpm run test-electron
        env:
          ARTIFACTS_DIR: artifacts/windows
          WORKER_COUNT: 4
          # Windows runner is very slow when writing to disk
          TEST_ELECTRON_TIMEOUT: 20000
        timeout-minutes: 5

      - name: Run release tests
        run: pnpm run test-release
        env:
          SIGNAL_ENV: production

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts

  sticker-creator:
    name: Sticker Creator
    needs: changes
    if: ${{ needs.changes.outputs.sticker-creator == 'true' && needs.changes.outputs.changesets-release != 'true' }}
    runs-on: ubuntu-22.04-8-cores
    timeout-minutes: 5

    defaults:
      run:
        working-directory: sticker-creator

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Check build
        background: true
        run: pnpm run build

      - name: Check types
        background: true
        run: pnpm run check:types

      - name: Check formatting
        background: true
        run: pnpm run prettier:check

      - name: Check lint
        background: true
        run: pnpm run lint

  mock-timings:
    name: Mock Test Timings
    runs-on: ubuntu-slim
    if: ${{ github.repository == 'signalapp/Signal-Desktop-Private' }}
    timeout-minutes: 5
    outputs:
      timings: ${{ steps.fetch.outputs.timings }}

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: &mock-timings-checkout-with
          filter: blob:none
          sparse-checkout: /.github/scripts/mock-timings/
          sparse-checkout-cone-mode: false

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env
        with: *mock-timings-checkout-with

      # Mock tests are split by index without timings
      - name: Fetch mock test timings
        id: fetch
        continue-on-error: true
        run: |
          timings=$(node .github/scripts/mock-timings/fetch.mjs)
          echo "timings=$timings" >> "$GITHUB_OUTPUT"
        env:
          BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN: ${{ secrets.BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN }}

  mock-tests:
    name: Mock Tests ${{ matrix.workerIndex.name }}

    strategy:
      fail-fast: false
      matrix:
        workerIndex:
          - name: '[1/8]'
            value: 0
          - name: '[2/8]'
            value: 1
          - name: '[3/8]'
            value: 2
          - name: '[4/8]'
            value: 3
          - name: '[5/8]'
            value: 4
          - name: '[6/8]'
            value: 5
          - name: '[7/8]'
            value: 6
          - name: '[8/8]'
            value: 7

    runs-on: ubuntu-latest-8-cores
    needs:
      - changes
      - mock-timings
    # Runs even if mock-timings fails
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.repository == 'signalapp/Signal-Desktop-Private' && needs.changes.outputs.changesets-release != 'true' }}
    timeout-minutes: 15

    env:
      BUILDKITE_ANALYTICS_TOKEN: ${{ secrets.BUILDKITE_ANALYTICS_TOKEN }}
      BUILDKITE_ANALYTICS_BRANCH: ${{ github.head_ref || github.ref_name }}
      BUILDKITE_ANALYTICS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          apt-packages: xvfb libpulse0
          install-electron: true

      - name: Run generate
        run: pnpm run generate

      - name: Create preload cache
        run: xvfb-run --auto-servernum pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/linux

      # Distinct display numbers because --auto-servernum races when both start at once
      - name: Run mock server tests
        background: true
        run: |
          set -o pipefail
          xvfb-run --server-num=97 pnpm run test-mock
        timeout-minutes: 15
        env:
          NODE_ENV: production
          DEBUG: mock:test:*
          ARTIFACTS_DIR: artifacts/mock
          WORKER_INDEX: ${{ matrix.workerIndex.value }}
          WORKER_COUNT: 8
          MOCHA_OPTIONS: --reporter mocha-multi-reporters --reporter-options configFile=.github/test-engine/mock-tests.json
          MOCHA_TIMINGS: ${{ needs.mock-timings.outputs.timings }}

      - name: Run mock server tests (without e164)
        background: true
        run: |
          set -o pipefail
          xvfb-run --server-num=98 pnpm run test-mock
        timeout-minutes: 15
        env:
          NODE_ENV: production
          DEBUG: mock:test:*
          ARTIFACTS_DIR: artifacts/mock-without-e164
          WORKER_INDEX: ${{ matrix.workerIndex.value }}
          WORKER_COUNT: 8
          MOCK_WITHOUT_E164: on
          MOCHA_OPTIONS: --reporter mocha-multi-reporters --reporter-options configFile=.github/test-engine/mock-tests-without-e164.json
          MOCHA_TIMINGS: ${{ needs.mock-timings.outputs.timings }}

      - name: Wait for mock server tests
        wait-all: true

      - name: Upload mock server test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.workerIndex.value }}
          path: artifacts

  mock-tests-docker:
    name: Mock Tests (docker)
    runs-on: ubuntu-latest-8-cores
    needs: changes
    if: ${{ github.repository == 'signalapp/Signal-Desktop-Private' && needs.changes.outputs.changesets-release != 'true' }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          apt-packages: xvfb libpulse0
          install-electron: true

      - name: Run generate
        run: pnpm run generate

      - name: Create preload cache
        run: xvfb-run --auto-servernum pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/linux

      - name: Run docker mock server tests
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y pipewire pipewire-pulse wireplumber psmisc pulseaudio-utils
          systemctl --user start pipewire.service
          systemctl --user start pipewire-pulse.service
          xvfb-run --auto-servernum pnpm run test-mock-docker
        timeout-minutes: 10
        env:
          NODE_ENV: production
          DEBUG: mock:test:*
          ARTIFACTS_DIR: artifacts/mock-docker

      - name: Upload docker mock server test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-docker
          path: artifacts

  check-min-os-version:
    name: Check Min OS Version
    # Inspects every platform's binaries without installing the app's dependencies
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: &check-min-os-version-checkout-with
          filter: blob:none
          fetch-depth: 2
          sparse-checkout: |
            /package.json
            /pnpm-lock.yaml
            /.github/scripts/min-os-version/
          sparse-checkout-cone-mode: false

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env
        with: *check-min-os-version-checkout-with

      - name: Check for dependency changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Plain assignments so a failing git diff fails the step
          check_changes=$(git diff --name-only HEAD^1 HEAD -- \
            .github/scripts/min-os-version \
            .github/workflows/ci.yml)
          input_changes=$(git diff --name-only HEAD^1 HEAD -- \
            package.json \
            pnpm-lock.yaml)
          if [ -n "$check_changes" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$input_changes" ]; then
            # The check compares the versions and settings it uses with HEAD^1
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "args=--base HEAD^1" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup min-os-version environment
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: .github/scripts/min-os-version
          require-lockfile: true
          # Use the runner's Node, any recent version works
          node-version-file: false
          # Its keys are unique per run, so it never hits and saves every time
          cache: false

      - name: Run OS version check
        if: ${{ steps.changes.outputs.changed == 'true' }}
        run: node check.mjs $ARGS
        working-directory: .github/scripts/min-os-version
        env:
          ARGS: ${{ steps.changes.outputs.args }}

  danger:
    name: Danger
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: &danger-checkout-with
          filter: blob:none

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env
        with: *danger-checkout-with

      - name: Setup danger environment
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: danger
          require-lockfile: true
          # Use the runner's Node, any recent version works
          node-version-file: false
          # Its keys are unique per run, so it never hits and saves every time
          cache: false

      - name: Run danger checks
        run: pnpm run danger:ci
        working-directory: danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.AUTOMATED_GITHUB_PAT }}

  storybook:
    name: Storybook
    needs: changes
    if: ${{ needs.changes.outputs.changesets-release != 'true' }}
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 10
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-playwright: true

      - name: Build storybook
        run: pnpm run build:storybook

      - id: storybook-server
        name: Serve storybook
        background: true
        run: pnpm run test:storybook:serve

      - name: Run storybook tests
        run: pnpm run test:storybook:test

      - name: Stop storybook server
        cancel: storybook-server

  axo:
    name: Axo
    needs: changes
    if: ${{ needs.changes.outputs.axo == 'true' && needs.changes.outputs.changesets-release != 'true' }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-playwright: true

      # Imported by ts/axo/emoji.std.ts
      - name: Build emoji data
        run: pnpm run build:emoji-data

      - name: Run axo tests
        run: pnpm run test:axo

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axo-test-failures
          path: ts/axo/**/__traces__
          if-no-files-found: ignore

  axo-visual:
    name: Axo Visual
    needs: changes
    if: ${{ needs.changes.outputs.axo == 'true' && needs.changes.outputs.changesets-release != 'true' }}
    # Reference screenshots are updated by update-axo-screenshots.yml, which
    # must use the same runner as this job
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-playwright: true

      # Imported by ts/axo/emoji.std.ts
      - name: Build emoji data
        run: pnpm run build:emoji-data

      - name: Run axo visual regression tests
        run: pnpm run test:axo:visual

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axo-visual-test-failures
          path: .vitest/attachments
          if-no-files-found: ignore

  benchmark:
    name: Benchmark
    strategy:
      matrix:
        metric:
          - startup
          - send
          - groupSend
          - largeGroupSendWithBlocks
          - largeGroupSend
          - convoOpen
          - callHistorySearch
          - backup
        include:
          - metric: startup
            script: ts/test-mock/benchmarks/startup_bench.node.js
            runCount: 10
          - metric: send
            script: ts/test-mock/benchmarks/send_bench.node.js
            runCount: 100
          - metric: groupSend
            script: ts/test-mock/benchmarks/group_send_bench.node.js
            runCount: 100
            conversationSize: 500
          - metric: largeGroupSendWithBlocks
            script: ts/test-mock/benchmarks/group_send_bench.node.js
            runCount: 50
            conversationSize: 500
            groupSize: 500
            contactCount: 500
            blockedCount: 10
            discardCount: 2
          - metric: largeGroupSend
            script: ts/test-mock/benchmarks/group_send_bench.node.js
            runCount: 20
            conversationSize: 50
            groupSize: 500
            contactCount: 500
            discardCount: 2
          - metric: convoOpen
            script: ts/test-mock/benchmarks/convo_open_bench.node.js
            runCount: 100
          - metric: callHistorySearch
            script: ts/test-mock/benchmarks/call_history_search_bench.node.js
            runCount: 100
          - metric: backup
            script: ts/test-mock/benchmarks/backup_bench.node.js

    runs-on: ubuntu-22.04-8-cores
    # Disabled until there's a Grafana DB to publish results to
    if: ${{ false && github.repository == 'signalapp/Signal-Desktop-Private' }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true

      - name: Retry checkout code
        if: ${{ steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        env: *retry-checkout-env

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          apt-packages: xvfb libpulse0

      - name: Run generate
        run: pnpm run generate

      - name: Create preload cache
        run: xvfb-run --auto-servernum pnpm run build:preload-cache

      - name: Set MAX_CYCLES=2 on main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "MAX_CYCLES=2" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.metric }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ./node_modules/.bin/tsx \
            ${{ matrix.script }} | tee benchmark.log
        timeout-minutes: 10
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_STACK_DUMPING: on
          DEBUG: 'mock:benchmarks'
          ARTIFACTS_DIR: artifacts/${{ matrix.metric }}
          GROUP_SIZE: ${{ matrix.groupSize }}
          CONTACT_COUNT: ${{ matrix.contactCount }}
          BLOCKED_COUNT: ${{ matrix.blockedCount }}
          DISCARD_COUNT: ${{ matrix.discardCount }}
          RUN_COUNT: ${{ matrix.runCount }}
          CONVERSATION_SIZE: ${{ matrix.conversationSize }}

      - name: Upload benchmark logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs
          path: artifacts

      - name: Clone benchmark repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'signalapp/Signal-Desktop-Benchmarks-Private'
          path: 'benchmark-results'
          token: ${{ secrets.AUTOMATED_GITHUB_PAT }}

      - name: Build benchmark repo
        working-directory: benchmark-results
        run: |
          pnpm install
          pnpm run build

      - name: Publish
        working-directory: benchmark-results
        run: |
          node ./bin/publish.js ../benchmark.log desktop.ci.performance.${{ matrix.metric }}
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  auto-merge-ready:
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.repository == 'signalapp/Signal-Desktop-Private'
    name: Auto Merge Ready
    needs:
      - changes
      - lint
      - linux
      - windows
      - sticker-creator
      - mock-tests
      - mock-tests-docker
      - check-min-os-version
      - danger
      - storybook
      - axo
      - axo-visual
      - benchmark
    runs-on: ubuntu-slim
    steps:
      - name: Check if any jobs failed or were cancelled
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more upstream jobs failed"
          exit 1
