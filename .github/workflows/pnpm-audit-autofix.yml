name: Auto-fix pnpm advisories

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 10:00 UTC (5-6am ET, 2-3am PT)
    - cron: '0 10 * * 1-5'
  # Rebuild the PR and issue when main's dependencies or this automation change
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'danger/pnpm-lock.yaml'
      - 'danger/pnpm-workspace.yaml'
      - '.github/scripts/min-os-version/pnpm-lock.yaml'
      - '.github/scripts/min-os-version/pnpm-workspace.yaml'
      - '.github/scripts/audit-deps/**'
      - '.github/workflows/pnpm-audit-autofix.yml'
  # `!ignore`, `!override` and `!unignore` on the issue or the PR
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autofix:
    name: Auto-fix pnpm advisories
    # Every comment in the repo triggers this workflow
    if: >-
      github.event_name != 'issue_comment' || (
        contains(github.event.issue.labels.*.name, 'pnpm-audit-autofix') &&
        github.event.comment.user.login != 'automated-signal' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          contains(github.event.comment.body, '!ignore') ||
          contains(github.event.comment.body, '!unignore') ||
          contains(github.event.comment.body, '!override')
        )
      )
    runs-on: ubuntu-22.04-8-cores
    timeout-minutes: 20
    # Here instead of on the workflow so skipped runs don't cancel queued ones
    concurrency:
      group: pnpm-audit-autofix
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup node and pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: false
          install: false

      - id: commands
        name: Apply commands
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATED_GITHUB_PAT || github.token }}
        run: node .github/scripts/audit-deps/apply-commands.mjs

      - id: fix
        name: Fix advisories
        env:
          BASE_REF: origin/main
        run: node .github/scripts/audit-deps/fix.mjs

      - name: Publish pull request
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATED_GITHUB_PAT || github.token }}
          PR_BODY: ${{ steps.fix.outputs.pr-body }}
          ISSUE_BODY: ${{ steps.fix.outputs.issue-body }}
          FIX_FAILED: ${{ steps.fix.outputs.failed }}
          REPLY: ${{ steps.commands.outputs.reply }}
          REPLY_FAILED: ${{ steps.commands.outputs.reply-failed }}
          REPLY_TO: ${{ steps.commands.outputs.reply-to }}
          REPLY_COMMENT_ID: ${{ steps.commands.outputs.reply-comment-id }}
        run: node .github/scripts/audit-deps/publish.mjs
